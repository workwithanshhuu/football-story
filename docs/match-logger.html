<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match logger — footArena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0C1A13; --ink-2:#0C2E20; --ink-3:#163D2A; --paper:#F7FCF8; --paper-2:#DFF3E7; --line:#CFE8D9;
  --turf:#0E8A52; --volt:#4FD394; --volt-ink:#06301D;
  --amber:#D97A24; --rust:#D93B36; --ok:#0E8A52; --ok-soft:#E4F4EC; --bad:#D93B36; --bad-soft:#FBE9E6;
  --mute:#40584B; --mute-2:#6C8779;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
body{margin:0;background:#0A130E;font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:16px}
.phone{width:100%;max-width:430px;background:var(--paper);border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(11,15,13,.22),0 2px 8px rgba(11,15,13,.12)}

/* ---------- scoreboard ---------- */
.board{background:var(--ink);color:var(--paper);padding:14px 16px 16px;position:relative;overflow:hidden}
.board:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% -10%, rgba(198,255,74,.13), transparent 55%);pointer-events:none}
.comp{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8B9186;margin-bottom:12px;display:flex;justify-content:space-between;position:relative;z-index:1}
.live{color:#FF6B5C;display:flex;align-items:center;gap:5px;font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:#FF6B5C;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.3}}

.rows{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:relative;z-index:1}
.team{display:flex;flex-direction:column;gap:3px;min-width:0}
.team.r{text-align:right;align-items:flex-end}
.tn{font-family:'Barlow Condensed',sans-serif;font-size:16.5px;font-weight:700;letter-spacing:.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tag{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.16em;color:#7C8177;display:flex;align-items:center;gap:5px}
.tag .sw{width:7px;height:7px;border-radius:2px;background:var(--volt)}
.team.r .tag{flex-direction:row-reverse}
.tag.away .sw{background:var(--rust)}

.centre{display:flex;flex-direction:column;align-items:center;gap:5px}
.tally{display:flex;align-items:center;gap:9px}
.stepcol{display:flex;flex-direction:column;gap:3px}
.st{width:22px;height:19px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#9CA096;border-radius:6px;cursor:pointer;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.st svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.st:active{background:var(--volt);border-color:var(--volt);color:var(--volt-ink)}
.num{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:800;line-height:.86;letter-spacing:-.01em;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.dash{font-size:26px;font-weight:400;color:#54574F;line-height:.86;padding:0 1px}
.num.flash{animation:pop .4s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.2);color:var(--volt)}100%{transform:scale(1)}}
.clockrow{display:flex;align-items:center;gap:7px}
.clock{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;color:#B9BDB2;background:rgba(255,255,255,.06);padding:3px 10px;border-radius:20px;font-variant-numeric:tabular-nums}

.sync{position:relative;z-index:1;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;color:#7C8177;font-weight:500}
.sync .sdot{width:6px;height:6px;border-radius:50%;background:var(--volt)}
.sync.pending .sdot{background:var(--amber);animation:bl 1.1s infinite}
.sync b{color:#C3C6BB;font-weight:700}

/* ---------- tabs / switch ---------- */
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--paper-2)}
.sw{padding:12px 8px 10px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute-2);cursor:pointer;position:relative}
.sw.on{color:var(--ink);border-bottom-color:var(--volt);background:var(--paper)}
.sw.on.away{border-bottom-color:var(--rust)}
.sw .b{font-family:Inter;font-size:9px;font-weight:700;background:var(--rust);color:#fff;padding:1px 5px;border-radius:8px;margin-left:5px;vertical-align:2px}

.bar{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper)}
#hint{font-size:12.5px;color:var(--mute-2)}
#hint b{color:var(--ink);font-weight:700}
.undo{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.04em;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.undo:active{transform:scale(.95);background:var(--paper-2)}
.undo:disabled{opacity:.4}

.sect{padding:14px 16px 4px}
.lbl{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute-2);margin-bottom:10px}

/* ---------- squad ---------- */
.squad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pl{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 9px 9px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;gap:5px;transition:transform .1s,border-color .1s,background .1s}
.pl:active{transform:scale(.96)}
.pl .av{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11.5px;color:#fff}
.pl .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.pl .ps{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;letter-spacing:.1em;color:var(--mute)}
.pl.on{background:var(--ink);border-color:var(--ink)}
.pl.on .nm{color:var(--paper)}
.pl.on .ps{color:#9CA096}
.pl.on .av{box-shadow:0 0 0 2px var(--volt)}

.numgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ng{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 4px 9px;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.ng:active{transform:scale(.94)}
.ng .n{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ng .p{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:.08em;color:var(--mute)}
.ng.on{background:var(--rust);border-color:var(--rust);color:#fff}
.ng.on .p{color:#FFDCCF}

/* ---------- floating action bar for selected player ---------- */
.selbar{margin:12px 16px 0;background:var(--ink);border-radius:14px;padding:11px 13px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(11,15,13,.28)}
.selbar.show{display:flex;animation:slideUp .22s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.selbar .av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.selbar .info{flex:1;min-width:0;color:var(--paper)}
.selbar .info .n1{font-size:13px;font-weight:700;line-height:1.2}
.selbar .info .n2{font-size:11px;color:#9CA096}
.selbar .go{background:var(--volt);color:var(--volt-ink);border:0;border-radius:9px;padding:9px 15px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;letter-spacing:.04em;cursor:pointer;text-transform:uppercase;flex-shrink:0}

/* ---------- glass action panel ---------- */
.glass{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;padding:0}
.glass.show{display:flex}
.glass-bg{position:absolute;inset:0;background:rgba(11,15,13,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.glass.show .glass-bg{opacity:1}
.gpanel{position:relative;width:100%;max-width:430px;border-radius:20px 20px 0 0;overflow:hidden;background:var(--paper);
  box-shadow:0 -10px 40px rgba(0,0,0,.3);transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.glass.show .gpanel{transform:translateY(0)}
.grab{width:36px;height:4px;background:var(--line);border-radius:3px;margin:10px auto 0}
.gtop{display:flex;align-items:center;gap:11px;padding:12px 16px 13px;border-bottom:1px solid var(--line)}
.gav{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;flex-shrink:0;color:#fff}
.gmeta{flex:1;min-width:0}
.gname{font-size:14.5px;font-weight:700;line-height:1.2}
.gsub{font-size:11.5px;color:var(--mute-2);font-weight:500;margin-top:1px}
.gclose{width:30px;height:30px;border-radius:50%;border:0;background:var(--paper-2);color:var(--mute-2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gbody{padding:13px 14px 18px;max-height:min(56vh,430px);overflow-y:auto}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ac{border-radius:12px;padding:13px 12px;font-family:'Barlow Condensed',sans-serif;font-size:14.5px;font-weight:700;letter-spacing:.01em;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);transition:transform .1s;text-align:left}
.ac:active{transform:scale(.96)}
.ac.g{background:var(--ok-soft);border-color:#BFE3D0;color:#0B6E3F}
.ac.b{background:var(--bad-soft);border-color:#F2C9C4;color:#A32B22}
.ac.hero{grid-column:span 2;font-size:19px;background:var(--volt);color:var(--volt-ink);border-color:var(--volt);text-align:center;letter-spacing:.02em;box-shadow:0 4px 14px rgba(198,255,74,.35)}
.ac.hero.away{background:var(--rust);color:#fff;border-color:var(--rust);box-shadow:0 4px 14px rgba(255,107,71,.32)}

.how{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.oppgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.skip{width:100%;padding:13px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mute-2);cursor:pointer}
.msheet h3{font-size:16px;font-weight:800;margin:12px 0 3px;text-align:center;font-family:Inter}
.msheet p{margin:0 0 15px;font-size:12px;color:var(--mute-2);text-align:center;padding:0 10px}

/* ---------- feed ---------- */
.log{padding:6px 16px 18px;background:var(--paper-2);min-height:80px}
.ev{font-size:12.5px;padding:9px 0;display:flex;gap:9px;align-items:center;border-bottom:1px solid rgba(11,15,13,.06)}
.ev:last-child{border:0}
.ev .t{font-family:'Barlow Condensed',sans-serif;color:var(--mute-2);min-width:30px;font-size:12.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 7px;text-align:center;font-variant-numeric:tabular-nums}
.ev .who{font-weight:600;flex-shrink:0}
.ev .what{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.02em;font-weight:700;text-align:right}
.ev .ic{width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.empty{font-size:12px;color:var(--mute);padding:14px 0;text-align:center}
</style>
</head>
<body>
<div class="phone">

  <div class="board">
    <div class="comp">
      <span>Kanpur Sunday League &middot; MD 12</span>
      <span class="live"><span class="dot"></span>Live</span>
    </div>
    <div class="rows">
      <div class="team">
        <span class="tn">Kanpur Utd</span>
        <span class="tag"><span class="sw"></span>Home</span>
      </div>
      <div class="centre">
        <div class="tally">
          <div class="stepcol">
            <button class="st" data-s="h" data-d="1" aria-label="Home up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
            <button class="st" data-s="h" data-d="-1" aria-label="Home down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
          </div>
          <span class="num" id="hs">1</span>
          <span class="dash">&ndash;</span>
          <span class="num" id="as">0</span>
          <div class="stepcol">
            <button class="st" data-s="a" data-d="1" aria-label="Away up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
            <button class="st" data-s="a" data-d="-1" aria-label="Away down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
          </div>
        </div>
        <div class="clockrow"><span class="clock" id="clock">63'</span></div>
      </div>
      <div class="team r">
        <span class="tn">Riverside</span>
        <span class="tag away">Away<span class="sw"></span></span>
      </div>
    </div>
    <div class="sync" id="sync"><span class="sdot"></span><span id="syncmsg">All events synced &middot; you're logging as <b>Host</b></span></div>
  </div>

  <div class="switch">
    <button class="sw on" id="swH">Kanpur Utd</button>
    <button class="sw away" id="swA">Riverside</button>
  </div>

  <div class="bar">
    <span id="hint">Tap a player, then what he did</span>
    <button class="undo" id="undo" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4M5 10h9a5 5 0 010 10h-1"/></svg>
      Undo
    </button>
  </div>

  <div class="sect">
    <div class="lbl" id="squadlbl">On the pitch</div>
    <div id="squad"></div>
  </div>

  <div class="selbar" id="selbar"></div>

  <div class="log" id="logsect" style="margin-top:14px">
    <div class="lbl">Match log</div>
    <div id="log"></div>
  </div>

</div>

<div class="glass" id="glass">
  <div class="glass-bg" id="glassbg"></div>
  <div class="gpanel" id="gpanel"></div>
</div>

<div class="glass" id="mod">
  <div class="glass-bg" id="modbg"></div>
  <div class="gpanel msheet" id="msheet"></div>
</div>

<script>
var teams={
 h:{name:"Kanpur Utd",named:true,players:[
   {n:"Arjun K",p:"ST",no:9},{n:"Rahul M",p:"LW",no:11},{n:"Dev P",p:"RW",no:7},
   {n:"Sameer T",p:"CAM",no:10},{n:"Karan J",p:"CM",no:8},{n:"Imran S",p:"CDM",no:6},
   {n:"Vikram S",p:"CB",no:5},{n:"Nikhil R",p:"CB",no:4},{n:"Aditya G",p:"LB",no:3},
   {n:"Manav D",p:"RB",no:2},{n:"Sunil B",p:"GK",no:1}]},
 a:{name:"Riverside",named:false,players:[
   {n:"#9",p:"ST",no:9},{n:"#11",p:"LW",no:11},{n:"#7",p:"RW",no:7},
   {n:"#10",p:"CAM",no:10},{n:"#8",p:"CM",no:8},{n:"#6",p:"CDM",no:6},
   {n:"#5",p:"CB",no:5},{n:"#4",p:"CB",no:4},{n:"#3",p:"LB",no:3},
   {n:"#2",p:"RB",no:2},{n:"#1",p:"GK",no:1}]}
};

var acts={
 ST:["Goal","Shot on target","Shot off target","Off the post","Assist","Chance created","Aerial won","Aerial lost","Fouled","Foul"],
 LW:["Goal","Shot on target","Shot off target","Assist","Chance created","Beat his man","Cross","Lost the ball","Fouled","Foul"],
 RW:["Goal","Shot on target","Shot off target","Assist","Chance created","Beat his man","Cross","Lost the ball","Fouled","Foul"],
 CAM:["Goal","Shot on target","Assist","Chance created","Key pass","Beat his man","Recovery","Lost the ball","Fouled","Foul"],
 CM:["Goal","Shot on target","Assist","Chance created","Recovery","Interception","Tackle won","Lost the ball","Fouled","Foul"],
 CDM:["Interception","Tackle won","Recovery","Block","Duel won","Duel lost","Dribbled past","Key pass","Fouled","Foul"],
 CB:["Duel won","Duel lost","Aerial won","Aerial lost","Interception","Clearance","Block","Dribbled past","Header cleared","Foul"],
 LB:["Duel won","Duel lost","Interception","Clearance","Cross","Chance created","Dribbled past","Recovery","Fouled","Foul"],
 RB:["Duel won","Duel lost","Interception","Clearance","Cross","Chance created","Dribbled past","Recovery","Fouled","Foul"],
 GK:["Save","Diving save","Claim","Punch","Sweep","Goal conceded","Long kick","Short distribution","Fouled","Foul"]
};

var good=["Goal","Shot on target","Assist","Chance created","Aerial won","Duel won","Tackle won","Interception","Clearance","Block","Recovery","Key pass","Beat his man","Save","Diving save","Claim","Punch","Sweep","Cross","Header cleared","Fouled"];
var bad=["Aerial lost","Duel lost","Dribbled past","Lost the ball","Foul","Goal conceded","Shot off target","Off the post"];
var goalTypes=["Strong foot","Weak foot","Header","Volley"];
var contested=["Beat his man","Duel won","Duel lost","Dribbled past","Aerial won","Aerial lost","Foul","Fouled","Tackle won"];
var avColors=["#315D44","#4B6337","#68413D","#80663A"];
function initials(name){var p=name.replace("#","").trim().split(/\s+/);return ((p[0]||"")[0]+((p[1]||"")[0]||"")).toUpperCase();}
function avColor(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return avColors[h%avColors.length];}

var side="h",sel=null,evs=[],score={h:1,a:0},clockMin=63,pendingSync=0;
function $(id){return document.getElementById(id);}
function vibrate(ms){if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}

function setScore(s,d,anim){
  score[s]=Math.max(0,score[s]+d);
  var el=$(s==="h"?"hs":"as");
  el.textContent=score[s];
  if(anim){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
}
document.querySelectorAll(".st").forEach(function(b){
  b.onclick=function(){var d=parseInt(b.dataset.d,10);setScore(b.dataset.s,d,d>0);vibrate(12);};
});

$("swH").onclick=function(){side="h";sel=null;paint();};
$("swA").onclick=function(){side="a";sel=null;paint();};

function paint(){
  $("swH").className="sw"+(side==="h"?" on":"");
  $("swA").className="sw away"+(side==="a"?" on":"");
  squadUI();selbarUI();
}

function squadUI(){
  var t=teams[side],box=$("squad");
  box.innerHTML="";
  $("squadlbl").innerHTML=t.named?"On the pitch":"Opposition &middot; by shirt number";
  box.className=t.named?"squad":"numgrid";
  t.players.forEach(function(p,i){
    var b=document.createElement("button");
    var col=avColor((t.named?p.n:t.name+p.no));
    if(t.named){
      b.className="pl team-home"+(sel===i?" on":"");
      b.innerHTML='<span class="av" style="background:'+col+'">'+initials(p.n)+'</span><span class="nm">'+p.n+'</span><span class="ps">'+p.p+' &middot; #'+p.no+'</span>';
    }else{
      b.className="ng team-away"+(sel===i?" on":"");
      b.innerHTML='<span class="n">'+p.no+'</span><span class="p">'+p.p+'</span>';
    }
    b.onclick=function(){sel=(sel===i?null:i);vibrate(10);paint();if(sel!==null)openGlass();};
    box.appendChild(b);
  });
}

function selbarUI(){
  var t=teams[side],bar=$("selbar");
  if(sel===null){bar.className="selbar";$("hint").textContent="Tap a player, then what he did";return;}
  var p=t.players[sel];
  var label=t.named?p.n:t.name+" "+p.n;
  $("hint").innerHTML='Logging for <b>'+label+'</b>';
  bar.className="selbar show";
  bar.innerHTML='<span class="av" style="background:'+avColor(t.named?p.n:t.name+p.no)+'">'+initials(p.n)+'</span>'+
    '<span class="info"><span class="n1">'+label+'</span><span class="n2">'+p.p+' &middot; tap to log an action</span></span>'+
    '<button class="go" id="reopen">Log</button>';
  $("reopen").onclick=openGlass;
}

function openGlass(){
  var t=teams[side],p=t.players[sel];
  var label=t.named?p.n:t.name+" "+p.n;
  $("gpanel").innerHTML='<div class="grab"></div><div class="gtop">'+
    '<span class="gav" style="background:'+avColor(t.named?p.n:t.name+p.no)+'">'+initials(p.n)+'</span>'+
    '<span class="gmeta"><span class="gname">'+label+'</span><span class="gsub">'+p.p+' &middot; '+t.name+'</span></span>'+
    '<button class="gclose" id="gclose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'+
    '<div class="gbody"><div class="acts" id="gacts"></div></div>';
  var g=$("gacts");
  acts[p.p].forEach(function(a){
    var b=document.createElement("button");
    var cls=a==="Goal"?" hero"+(side==="a"?" away":""):good.indexOf(a)>-1?" g":bad.indexOf(a)>-1?" b":"";
    b.className="ac"+cls;
    b.textContent=a;
    b.onclick=function(){
      vibrate(a==="Goal"?[15,40,15]:12);
      if(a==="Goal"){askGoal(p);}
      else if(contested.indexOf(a)>-1){askOpp(p,a);}
      else{push(p,a,false);closeGlass();}
    };
    g.appendChild(b);
  });
  $("gclose").onclick=closeGlass;
  $("glass").classList.add("show");
}
function closeGlass(){$("glass").classList.remove("show");}
$("glassbg").onclick=closeGlass;

function askGoal(p){
  $("msheet").innerHTML='<div class="grab"></div><h3>How did he score?</h3><p>One extra tap. Builds his finishing profile.</p><div class="how" id="mopts" style="padding:0 14px 18px"></div>';
  goalTypes.forEach(function(t){
    var b=document.createElement("button");
    b.className="ac g";b.textContent=t;
    b.onclick=function(){
      push(p,"Goal \u2014 "+t.toLowerCase(),true);
      setScore(side,1,true);
      vibrate([20,50,20]);
      closeMod();closeGlass();
    };
    $("mopts").appendChild(b);
  });
  $("mod").classList.add("show");
}

function askOpp(p,a){
  var other=side==="h"?"a":"h",t=teams[other];
  $("msheet").innerHTML='<div class="grab"></div><h3>Against who?</h3><p>Tap the shirt number if you caught it \u2014 or skip. Their card gets the flip side.</p><div class="oppgrid" id="ogrid" style="padding:0 14px"></div><div style="padding:0 14px 18px"><button class="skip" id="oskip">Skip &mdash; log anyway</button></div>';
  t.players.forEach(function(o){
    var b=document.createElement("button");
    b.className="ng";
    b.innerHTML='<span class="n">'+o.no+'</span><span class="p">'+o.p+'</span>';
    b.onclick=function(){push(p,a+" vs "+t.name+" #"+o.no,false);closeMod();closeGlass();};
    $("ogrid").appendChild(b);
  });
  $("oskip").onclick=function(){push(p,a,false);closeMod();closeGlass();};
  $("mod").classList.add("show");
}
function closeMod(){$("mod").classList.remove("show");}
$("modbg").onclick=closeMod;

function push(p,a,isGoal){
  var t=teams[side];
  evs.push({p:(t.named?p.n:t.name+" #"+p.no),a:a,m:clockMin,g:!!isGoal,s:side});
  sel=null;
  pendingSync++;
  syncUI();
  logUI();paint();
}

function syncUI(){
  var el=$("sync");
  if(pendingSync>0){
    el.className="sync pending";
    $("syncmsg").innerHTML="<b>"+pendingSync+" action"+(pendingSync===1?"":"s")+"</b> syncing\u2026";
    clearTimeout(window._syncTimer);
    window._syncTimer=setTimeout(function(){pendingSync=0;syncUI();},1400);
  }else{
    el.className="sync";
    $("syncmsg").innerHTML="All events synced &middot; you're logging as <b>Host</b>";
  }
}

function logUI(){
  var L=$("log");
  $("undo").disabled=!evs.length;
  if(!evs.length){L.innerHTML='<div class="empty">Nothing logged yet \u2014 goals, cards and key actions will appear here.</div>';return;}
  L.innerHTML=evs.slice(-6).reverse().map(function(e){
    var base=e.a.split(" vs ")[0];
    var c=e.g?(e.s==="a"?"var(--rust)":"var(--turf)"):good.indexOf(base)>-1?"var(--ok)":bad.indexOf(base)>-1?"var(--bad)":"var(--mute-2)";
    var ic=e.g?'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m8 9 4 3 4-3M8 15l4-3 4 3"/></svg>':base==="Foul"?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8M9 4v4l-2 3a5 5 0 0 0 10 0l-2-3V4M8 19h8"/></svg>':bad.indexOf(base)>-1?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-8"/></svg>';
    return '<div class="ev"><span class="ic">'+ic+'</span><span class="t">'+e.m+"'</span><span class=\"who\">"+e.p+'</span><span class="what" style="color:'+c+'">'+e.a+'</span></div>';
  }).join("");
}

$("undo").onclick=function(){
  var last=evs.pop();
  if(!last)return;
  if(last.g)setScore(last.s,-1,false);
  pendingSync=Math.max(0,pendingSync-1);
  vibrate(15);
  syncUI();logUI();
};

/* light clock tick so the board feels alive */
setInterval(function(){
  clockMin+=1;
  $("clock").textContent=clockMin+"'";
},15000);

paint();logUI();syncUI();
</script>
</body>
</html>
